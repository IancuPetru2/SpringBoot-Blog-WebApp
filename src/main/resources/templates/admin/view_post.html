<!DOCTYPE html>
<html lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
<div th:replace="admin/header :: header"></div>
<body>
<div th:replace="admin/header :: navbar"></div>
<div class="container"  style="padding-bottom: 80px;">
    <div class="row">


        <div class="col-md-8 offset-md-2">
            <h2 th:text="${post.title}"></h2>
            <hr/>
            <h4 th:text="${post.shortDescription}"></h4>
            <hr />


            <div th:utext="${post.content}">
            </div>


            <div th:if="${post.aiHook != null and post.aiSummaryLocked}" class="alert alert-light border">
                <p style="color: blue;"><strong>Generated summary</strong></p>
                <p><strong th:text="${post.aiHook}"></strong></p>
                <p th:text="${post.aiExcerpt}"></p>
                <ul th:if="${post.aiTldr}" th:unless="${#lists.isEmpty(post.aiTldr)}">
                    <li th:each="line : ${post.aiTldr}" th:text="${line}"></li>
                </ul>

            </div>
            <div class="text-center mt-4">
                <a th:href="@{/admin/posts}" class="btn btn-outline-secondary">Cancel</a>
            </div>

        </div>
    </div>
</div>


<div th:replace="admin/footer :: footer"></div>
</body>
</html>
