<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{admin/header :: header}"></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{admin/header :: navbar}"></nav>

<main class="container flex-grow-1">

    <div class="row">
        <h1>List Blog Posts</h1>
    </div>

    <div class="row">
        <div class="col-md-5">
            <div class="form-group">
                <form class="form-inline"
                      th:action="@{/admin/posts/search}"
                      method="get">

                    <div class="input-group">
                        <input type="text"
                               class="form-control"
                               name="query"
                               th:value="${query}"
                               placeholder="Search posts..."/>

                        <span class="input-group-btn">
                            <button class="btn btn-primary"
                                    type="submit">
                                Search
                            </button>
                        </span>
                    </div>
                    <!-- Warning when no posts are found -->
                    <div class="alert alert-warning text-center"
                         role="alert"
                         th:if="${#lists.isEmpty(posts) and !#strings.isEmpty(query)}">

                        <h5 class="alert-heading">No posts found!</h5>
                        <p class="mb-0">
                            No posts match your search. Please try different keywords.
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <br />

    <table class="table table-striped table-hover table-bordered"  th:if="${!#lists.isEmpty(posts)}">

        <thead class="table-dark">
        <tr>
            <th style="width:10%">#</th>
            <th style="width:20%">Post Title</th>
            <th style="width:30%">Post Short Description</th>
            <th style="width:15%">Created By</th>
            <th style="width:20%">Post Created On</th>
            <th style="width:20%">Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="post, postStat : ${posts}">

            <td th:text="${postStat.count}">1</td>

            <td th:text="${post.title}">
                post title
            </td>

            <td th:text="${post.shortDescription}">
                post short description
            </td>

            <td th:text="${post.user}">
                username
            </td>

            <td th:text="${#temporals.format(post.createdOn,'dd MMM yyyy')}">
                10 JUL 2022
            </td>

            <td class="text-nowrap">

                <a th:href="@{/admin/posts/{postId}/edit(postId=${post.id})}"
                   class="btn btn-primary btn-sm">
                    Edit
                </a>

                <a th:href="@{/admin/posts/{postId}/delete(postId=${post.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this post? This cannot be undone.');">
                    Delete
                </a>

                <a th:href="@{/admin/posts/{postUrl}/view(postUrl=${post.url})}"
                   class="btn btn-info btn-sm">
                    View
                </a>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- PAGINATION -->
    <nav th:if="${totalPages > 1}"
         aria-label="Post pagination"
         class="mt-4 mb-5">

        <ul class="pagination justify-content-center">

            <!-- Previous -->
            <li class="page-item"
                th:classappend="${isFirst} ? 'disabled'">

                <a class="page-link"
                   th:if="${!#strings.isEmpty(query)}"
                   th:href="@{/admin/posts/search(query=${query}, pageNo=${currentPage - 1}, pageSize=5)}">
                    Previous
                </a>

                <a class="page-link"
                   th:if="${#strings.isEmpty(query)}"
                   th:href="@{/admin/posts(pageNo=${currentPage - 1}, pageSize=5)}">
                    Previous
                </a>
            </li>

            <!-- Page numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">

                <a class="page-link"
                   th:if="${!#strings.isEmpty(query)}"
                   th:href="@{/admin/posts/search(query=${query}, pageNo=${i}, pageSize=5)}"
                   th:text="${i + 1}">
                </a>

                <a class="page-link"
                   th:if="${#strings.isEmpty(query)}"
                   th:href="@{/admin/posts(pageNo=${i}, pageSize=5)}"
                   th:text="${i + 1}">
                </a>
            </li>

            <!-- Next -->
            <li class="page-item"
                th:classappend="${isLast} ? 'disabled'">

                <a class="page-link"
                   th:if="${!#strings.isEmpty(query)}"
                   th:href="@{/admin/posts/search(query=${query}, pageNo=${currentPage + 1}, pageSize=5)}">
                    Next
                </a>

                <a class="page-link"
                   th:if="${#strings.isEmpty(query)}"
                   th:href="@{/admin/posts(pageNo=${currentPage + 1}, pageSize=5)}">
                    Next
                </a>
            </li>

        </ul>
    </nav>

</main>


<div th:replace="~{admin/footer :: footer}"></div>

</body>
</html>
