<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Password</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .update-password-container {
            margin-top: 100px;
        }
        .update-password-card {
            border: 1px solid #28a745;
        }
        .update-password-card-header {
            background-color: #28a745;
            color: red;
        }
        .btn-primary {
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-primary:hover {
            background-color: #218838;
            border-color: #218838;
        }
        .form-label {
            font-weight: bold;
        }

    </style>
</head>
<body>
<div th:replace="admin/header :: header"></div>
<div th:replace="admin/header :: navbar"></div>
<div class="container update-password-container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card update-password-card">

                <div class="card-header update-password-card-header text-center">
                    <h3  >Update Password</h3>
                </div>

                <div class="card-body">
                    <form th:action="@{/update-password}"
                          th:object="${updatePasswordDto}"
                          method="post">

                        <!-- Current Password -->
                        <div class="form-group mb-3">
                            <label class="form-label">Current Password:</label>
                            <input type="password"
                                   th:field="*{currentPassword}"
                                   class="form-control"
                                   autocomplete="new-password" />
                            <span th:if="${#fields.hasErrors('currentPassword')}"
                                  th:errors="*{currentPassword}"
                                  style="color:red"></span>
                        </div>

                        <!-- New Password -->
                        <div class="form-group mb-3">
                            <label class="form-label">New Password:</label>
                            <input type="password"
                                   th:field="*{newPassword}"
                                   class="form-control"
                                   autocomplete="new-password" />
                            <span th:if="${#fields.hasErrors('newPassword')}"
                                  th:errors="*{newPassword}"
                                  style="color:red"></span>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="form-group mb-3">
                            <label class="form-label">Confirm New Password:</label>
                            <input type="password"
                                   th:field="*{confirmNewPassword}"
                                   class="form-control"
                                   autocomplete="new-password" />
                            <span th:if="${#fields.hasErrors('confirmNewPassword')}"
                                  th:errors="*{confirmNewPassword}"
                                  style="color:red"></span>
                        </div>

                        <!-- Submit Button -->
                        <div class="form-group text-center mb-3">
                            <a th:href="@{/admin/posts}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary btn-block">
                                Update Password
                            </button>
                        </div>

                        <!-- Error Message -->
                        <div th:if="${error}" class="form-group text-center">
                            <p style="color: red;" th:text="${error}"></p>
                        </div>

                        <!-- Success Message -->
                        <div th:if="${message}" class="form-group text-center">
                            <p style="color: green;" th:text="${message}"></p>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="admin/footer :: footer"></div>
</body>
</html>
