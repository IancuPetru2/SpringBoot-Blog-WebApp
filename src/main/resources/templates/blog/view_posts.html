<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
>
<div th:replace="blog/header :: header"></div>
<body class="d-flex flex-column min-vh-100">
<div th:replace="blog/header :: navbar"></div>
<br />
<!--<div class="container">-->
    <main class="container flex-grow-1">
    <div class="row">
        <div class="col-md-9">
            <div th:each = "post: ${postsResponse}">
                <div class="card">
                    <div class="card-header">
                        <h3>
                            <a th:href="@{/post/{postUrl}(postUrl=${post.url})}"
                                th:text="${post.title}"></a>
                        </h3>
                        <div>
                            <strong th:text="${#temporals.format(post.createdOn, 'dd MMMM yyyy')}">

                            </strong>
                        </div>
                    </div>
                    <div class="card-body">
                        <span th:utext="${post.shortDescription}"> </span>
                        <a th:href="@{/post/{postUrl}(postUrl=${post.url})}">Read more</a>
                    </div>
                </div>
                <br />
            </div>
            <div>
                <!-- Pagination -->
                <nav th:if="${totalPages > 1}" aria-label="Post pagination">
                    <ul class="pagination justify-content-center">

                        <!-- Previous -->
                        <li class="page-item" th:classappend="${isFirst} ? 'disabled'">
                            <a class="page-link"
                               th:if="${!#strings.isEmpty(query)}"
                               th:href="@{/page/search(query=${query}, pageNo=${currentPage - 1}, pageSize=5)}">
                                Previous
                            </a>

                            <a class="page-link"
                               th:if="${#strings.isEmpty(query)}"
                               th:href="@{/(pageNo=${currentPage - 1}, pageSize=5)}">
                                Previous
                            </a>
                        </li>

                        <!-- Page numbers -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">

                            <a class="page-link"
                               th:if="${!#strings.isEmpty(query)}"
                               th:href="@{/page/search(query=${query}, pageNo=${i}, pageSize=5)}"
                               th:text="${i + 1}">
                            </a>

                            <a class="page-link"
                               th:if="${#strings.isEmpty(query)}"
                               th:href="@{/(pageNo=${i}, pageSize=5)}"
                               th:text="${i + 1}">
                            </a>
                        </li>

                        <!-- Next -->
                        <li class="page-item" th:classappend="${isLast} ? 'disabled'">
                            <a class="page-link"
                               th:if="${!#strings.isEmpty(query)}"
                               th:href="@{/page/search(query=${query}, pageNo=${currentPage + 1}, pageSize=5)}">
                                Next
                            </a>

                            <a class="page-link"
                               th:if="${#strings.isEmpty(query)}"
                               th:href="@{/(pageNo=${currentPage + 1}, pageSize=5)}">
                                Next
                            </a>
                        </li>

                    </ul>
                </nav>

                <!-- No posts found -->
                <div class="alert alert-info text-center"
                     th:if="${#lists.isEmpty(postsResponse)}">

                    <h4 th:if="${!#strings.isEmpty(query)}">No posts found</h4>
                    <p th:if="${!#strings.isEmpty(query)}">
                        Try different search terms.
                    </p>

                    <h4 th:if="${#strings.isEmpty(query)}">No posts available</h4>
                    <p th:if="${#strings.isEmpty(query)}">
                        There are currently no posts to display.
                    </p>
                </div>
            </div>


        </div>

        <div class="col-md-3">
        <!-- search bar           -->
            <div th:replace="blog/search :: search"></div>
        </div>
    </div>

    </main>
<div th:replace="blog/footer :: footer"></div>
</body>
</html>
